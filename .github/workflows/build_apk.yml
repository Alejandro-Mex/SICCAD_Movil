name: Compilar APK SICAD
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.3
          channel: stable
      - name: Compilar APK
        run: |
          pip install flet==0.24.1 requests
          flet build apk --project SICAD_Movil --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: SICAD_Movil_APK
          path: build/apk/*.apk
