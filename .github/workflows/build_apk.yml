name: Compilar APK SICAD

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter 3.24.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Inyectar wakelock_plus 1.2.8 en pubspec.yaml y Compilar APK
        run: |
          yes | flutter doctor --android-licenses || true
          pip install "flet==0.24.1" "packaging<24.0" requests
          python -c "import flet.cli.commands.build as b, inspect; p = inspect.getfile(b); txt = open(p).read(); target = 'with open(pubspec_path, \"w\", encoding=\"utf8\") as f:'; patch = 'pubspec[\"dependency_overrides\"] = {\"wakelock_plus\": \"1.2.8\", \"package_info_plus\": \"8.0.2\"}\n        ' + target; assert target in txt, 'No se encontro target'; open(p, 'w').write(txt.replace(target, patch)); print('EXITO: pubspec.yaml parchado!')"
          flet build apk --project SICAD_Movil --no-rich-output -v

      - name: Subir APK listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: SICAD_Movil_APK
          path: build/apk/*.apk