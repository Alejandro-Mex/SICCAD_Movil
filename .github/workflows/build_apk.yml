name: Compilar APK SICAD

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compilar APK (Flet instala su propio Flutter exacto)
        run: |
          yes | sudo $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          pip install "flet==0.27.6" requests
          flet build apk --project SICAD_Movil --no-rich-output -vv

      - name: Subir APK listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: SICAD_Movil_APK
          path: build/apk/*.apk